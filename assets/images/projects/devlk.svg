<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDev" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#062e26" />
      <stop offset="70%" stop-color="#041814" />
      <stop offset="100%" stop-color="#010806" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgDev)" />
  <rect width="596" height="596" x="2" y="2" rx="35" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="2" />
  
  <circle cx="300" cy="260" r="130" fill="#10b981" opacity="0.12" filter="url(#emeraldGlow)" />

  <!-- LMS AI Brain / Screen Icon -->
  <rect x="200" y="160" width="200" height="150" rx="20" fill="#0b241c" stroke="url(#emeraldGrad)" stroke-width="4" filter="url(#emeraldGlow)" />
  
  <!-- Screen Elements -->
  <path d="M230 210 L260 235 L230 260" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="280" y1="260" x2="350" y2="260" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" />
  <circle cx="340" cy="205" r="14" fill="url(#aiGrad)" filter="url(#emeraldGlow)" />
  <path d="M334 205 L346 205 M340 199 L340 211" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Base Stand -->
  <path d="M270 310 L260 345 L340 345 L330 310 Z" fill="#0b241c" stroke="#10b981" stroke-width="3" />
  <rect x="235" y="345" width="130" height="12" rx="6" fill="#10b981" />

  <!-- Code Nodes -->
  <circle cx="160" cy="220" r="6" fill="#34d399" opacity="0.7" />
  <line x1="166" y1="220" x2="200" y2="220" stroke="rgba(52, 211, 153, 0.4)" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="440" cy="240" r="6" fill="#34d399" opacity="0.7" />
  <line x1="400" y1="240" x2="434" y2="240" stroke="rgba(52, 211, 153, 0.4)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Badge Label -->
  <rect x="180" y="470" width="240" height="48" rx="24" fill="rgba(6, 46, 38, 0.9)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" />
  <text x="300" y="501" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="3">DEVLK.COM LMS</text>
</svg>
