<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgFlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#300d38" />
      <stop offset="70%" stop-color="#18051c" />
      <stop offset="100%" stop-color="#08020a" />
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgFlow)" />
  <rect width="596" height="596" x="2" y="2" rx="35" fill="none" stroke="rgba(232, 121, 249, 0.2)" stroke-width="2" />
  
  <circle cx="300" cy="260" r="140" fill="#a855f7" opacity="0.15" filter="url(#purpleGlow)" />

  <!-- Flow Generation Core -->
  <polygon points="300,140 400,200 400,320 300,380 200,320 200,200" fill="#1f0724" stroke="url(#purpleGrad)" stroke-width="4" filter="url(#purpleGlow)" />
  
  <!-- Neural Flow Vortex -->
  <path d="M260 210 Q 300 240 340 210 Q 380 260 300 300 Q 230 270 260 210 Z" fill="none" stroke="url(#boltGrad)" stroke-width="4" filter="url(#purpleGlow)" />
  
  <!-- Lightning Bolt -->
  <path d="M305 180 L275 255 L310 255 L285 330 L335 240 L300 240 Z" fill="url(#boltGrad)" filter="url(#purpleGlow)" />

  <!-- Railway Speed Lines -->
  <line x1="130" y1="410" x2="470" y2="410" stroke="rgba(232, 121, 249, 0.4)" stroke-width="2" stroke-dasharray="12,8" />
  <line x1="160" y1="425" x2="440" y2="425" stroke="rgba(232, 121, 249, 0.2)" stroke-width="1.5" stroke-dasharray="8,6" />

  <!-- Badge Label -->
  <rect x="180" y="470" width="240" height="48" rx="24" fill="rgba(48, 13, 56, 0.9)" stroke="rgba(232, 121, 249, 0.4)" stroke-width="1.5" />
  <text x="300" y="501" fill="#e879f9" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" text-anchor="middle" letter-spacing="2.5">FLOWBOT API</text>
</svg>
