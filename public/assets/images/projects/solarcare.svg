<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSolarcare" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b2408" />
      <stop offset="70%" stop-color="#1c1003" />
      <stop offset="100%" stop-color="#080401" />
    </radialGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgSolarcare)" />
  <rect width="596" height="596" x="2" y="2" rx="35" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" />
  
  <circle cx="300" cy="255" r="140" fill="#f59e0b" opacity="0.14" filter="url(#solarGlow)" />

  <!-- Solar Photovoltaic Grid -->
  <polygon points="300,160 410,210 390,320 210,320 190,210" fill="#091b29" stroke="url(#panelGrad)" stroke-width="3.5" filter="url(#solarGlow)" />
  <line x1="300" y1="160" x2="300" y2="320" stroke="url(#panelGrad)" stroke-width="2.5" />
  <line x1="245" y1="185" x2="255" y2="320" stroke="url(#panelGrad)" stroke-width="2" />
  <line x1="355" y1="185" x2="345" y2="320" stroke="url(#panelGrad)" stroke-width="2" />
  <line x1="195" y1="265" x2="405" y2="265" stroke="url(#panelGrad)" stroke-width="2" />

  <!-- Sun Rays Radiating from top -->
  <circle cx="300" cy="130" r="18" fill="url(#sunGrad)" filter="url(#solarGlow)" />
  <line x1="300" y1="95" x2="300" y2="105" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" />
  <line x1="270" y1="105" x2="278" y2="113" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" />
  <line x1="330" y1="105" x2="322" y2="113" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" />

  <!-- Shield / Cloudflare / Supabase Sync Pill -->
  <path d="M280 345 L320 345 L325 375 L300 390 L275 375 Z" fill="#ea580c" opacity="0.85" />
  <path d="M294 365 L299 370 L308 360" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Badge Label -->
  <rect x="160" y="470" width="280" height="48" rx="24" fill="rgba(45, 20, 5, 0.9)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
  <text x="300" y="501" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" text-anchor="middle" letter-spacing="2.5">PIRM SOLAR CARE</text>
</svg>
