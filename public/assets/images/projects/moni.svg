<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMoni" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14281e" />
      <stop offset="70%" stop-color="#09140e" />
      <stop offset="100%" stop-color="#020503" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="moniGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgMoni)" />
  <rect width="596" height="596" x="2" y="2" rx="35" fill="none" stroke="rgba(234, 179, 8, 0.25)" stroke-width="2" />
  
  <circle cx="300" cy="255" r="140" fill="#eab308" opacity="0.12" filter="url(#moniGlow)" />

  <!-- 3D Financial Vault / QR Core -->
  <rect x="205" y="155" width="190" height="190" rx="28" fill="#0d1f17" stroke="url(#goldGrad)" stroke-width="4" filter="url(#moniGlow)" />
  
  <!-- Central Currency / Growth Graph -->
  <circle cx="300" cy="250" r="48" fill="none" stroke="url(#finGrad)" stroke-width="5" />
  <path d="M280 260 L295 240 L310 250 L325 230" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- QR Sync Accents -->
  <rect x="225" y="175" width="22" height="22" rx="4" fill="#6ee7b7" />
  <rect x="353" y="175" width="22" height="22" rx="4" fill="#6ee7b7" />
  <rect x="225" y="303" width="22" height="22" rx="4" fill="#6ee7b7" />

  <!-- Orbiting Coin Sparkles -->
  <circle cx="160" cy="220" r="7" fill="#fef08a" filter="url(#moniGlow)" />
  <circle cx="440" cy="280" r="7" fill="#6ee7b7" filter="url(#moniGlow)" />

  <!-- Badge Label -->
  <rect x="180" y="470" width="240" height="48" rx="24" fill="rgba(20, 40, 30, 0.9)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1.5" />
  <text x="300" y="501" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="3">MONI FINANCE</text>
</svg>
