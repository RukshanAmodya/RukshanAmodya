<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBookBoo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1045" />
      <stop offset="70%" stop-color="#140620" />
      <stop offset="100%" stop-color="#06010a" />
    </radialGradient>
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bookPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <filter id="magicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="600" rx="36" fill="url(#bgBookBoo)" />
  <rect width="596" height="596" x="2" y="2" rx="35" fill="none" stroke="rgba(244, 114, 182, 0.25)" stroke-width="2" />
  
  <!-- Ambient Magic Aura -->
  <circle cx="300" cy="255" r="140" fill="#c084fc" opacity="0.16" filter="url(#magicGlow)" />

  <!-- 3D Open Story Book Base Cover -->
  <path d="M160 320 Q 300 360 440 320 L450 350 Q 300 390 150 350 Z" fill="#86198f" filter="url(#magicGlow)" />

  <!-- Left Page -->
  <path d="M165 200 Q 230 180 300 210 L300 340 Q 230 310 165 330 Z" fill="url(#bookPage)" stroke="#e879f9" stroke-width="2.5" />
  
  <!-- Right Page -->
  <path d="M435 200 Q 370 180 300 210 L300 340 Q 370 310 435 330 Z" fill="url(#bookPage)" stroke="#e879f9" stroke-width="2.5" />

  <!-- Book Spine Center Glow -->
  <line x1="300" y1="210" x2="300" y2="340" stroke="#c084fc" stroke-width="3" />

  <!-- Magical Story Elements Rising from Pages -->
  <!-- Cute Castle / Tree Silhouette on Page -->
  <path d="M210 280 L225 245 L240 280 Z" fill="#c084fc" opacity="0.8" />
  <circle cx="225" cy="240" r="4" fill="#f472b6" />
  <path d="M360 280 Q 375 240 390 280 Z" fill="#60a5fa" opacity="0.8" />

  <!-- Audio Wave / Melody Notes Floating -->
  <path d="M260 170 Q 300 130 340 170" fill="none" stroke="url(#magicGrad)" stroke-width="4" stroke-linecap="round" filter="url(#magicGlow)" />
  <circle cx="300" cy="145" r="6" fill="#f472b6" filter="url(#magicGlow)" />
  <circle cx="250" cy="175" r="5" fill="#60a5fa" filter="url(#magicGlow)" />
  <circle cx="350" cy="175" r="5" fill="#fef08a" filter="url(#magicGlow)" />

  <!-- Floating 3D Sparkle Stars -->
  <polygon points="300,105 306,120 322,120 309,130 314,145 300,135 286,145 291,130 278,120 294,120" fill="url(#goldStar)" filter="url(#magicGlow)" />
  <polygon points="190,150 194,160 205,160 196,167 199,177 190,170 181,177 184,167 175,160 186,160" fill="url(#goldStar)" opacity="0.9" />
  <polygon points="410,150 414,160 425,160 416,167 419,177 410,170 401,177 404,167 395,160 406,160" fill="url(#goldStar)" opacity="0.9" />

  <!-- Floating Audio Speaker Waves -->
  <path d="M430 250 Q 455 260 455 280 Q 455 300 430 310" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <path d="M170 250 Q 145 260 145 280 Q 145 300 170 310" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.75" />

  <!-- Badge Label -->
  <rect x="180" y="470" width="240" height="48" rx="24" fill="rgba(45, 16, 69, 0.9)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" />
  <text x="300" y="501" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="3">BOOKBOO KIDS</text>
</svg>
