<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgAeth" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c2045" />
      <stop offset="70%" stop-color="#050e20" />
      <stop offset="100%" stop-color="#01040a" />
    </radialGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="aethGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgAeth)" />
  <rect width="596" height="596" x="2" y="2" rx="35" fill="none" stroke="rgba(96, 165, 250, 0.25)" stroke-width="2" />
  
  <circle cx="300" cy="260" r="140" fill="#3b82f6" opacity="0.16" filter="url(#aethGlow)" />

  <!-- Multi-Agent Autonomous Nodes Network -->
  <!-- Center Core Node -->
  <polygon points="300,190 350,220 350,280 300,310 250,280 250,220" fill="#081730" stroke="url(#blueGrad)" stroke-width="3.5" filter="url(#aethGlow)" />
  <circle cx="300" cy="250" r="18" fill="url(#neonCyan)" filter="url(#aethGlow)" />

  <!-- Outer Agent Satellites -->
  <circle cx="200" cy="180" r="14" fill="#081730" stroke="#60a5fa" stroke-width="3" />
  <line x1="212" y1="190" x2="252" y2="225" stroke="rgba(96, 165, 250, 0.6)" stroke-width="2.5" stroke-dasharray="4,4" />

  <circle cx="400" cy="180" r="14" fill="#081730" stroke="#60a5fa" stroke-width="3" />
  <line x1="388" y1="190" x2="348" y2="225" stroke="rgba(96, 165, 250, 0.6)" stroke-width="2.5" stroke-dasharray="4,4" />

  <circle cx="200" cy="320" r="14" fill="#081730" stroke="#60a5fa" stroke-width="3" />
  <line x1="212" y1="310" x2="252" y2="275" stroke="rgba(96, 165, 250, 0.6)" stroke-width="2.5" stroke-dasharray="4,4" />

  <circle cx="400" cy="320" r="14" fill="#081730" stroke="#60a5fa" stroke-width="3" />
  <line x1="388" y1="310" x2="348" y2="275" stroke="rgba(96, 165, 250, 0.6)" stroke-width="2.5" stroke-dasharray="4,4" />

  <circle cx="300" cy="380" r="14" fill="#081730" stroke="#60a5fa" stroke-width="3" />
  <line x1="300" y1="366" x2="300" y2="310" stroke="rgba(96, 165, 250, 0.6)" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Orbit Flow Ring -->
  <ellipse cx="300" cy="250" rx="160" ry="70" fill="none" stroke="rgba(34, 211, 238, 0.3)" stroke-width="2" stroke-dasharray="10,8" transform="rotate(-15 300 250)" />

  <!-- Badge Label -->
  <rect x="180" y="470" width="240" height="48" rx="24" fill="rgba(12, 32, 69, 0.9)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1.5" />
  <text x="300" y="501" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="3">AETHERA V2</text>
</svg>
