<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSolarjade" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#063323" />
      <stop offset="70%" stop-color="#031a12" />
      <stop offset="100%" stop-color="#010a07" />
    </radialGradient>
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="jadeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgSolarjade)" />
  <rect width="596" height="596" x="2" y="2" rx="35" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="2" />
  
  <circle cx="300" cy="255" r="140" fill="#10b981" opacity="0.15" filter="url(#jadeGlow)" />

  <!-- Solar Jade Hexagon Grid -->
  <polygon points="300,145 390,195 390,305 300,355 210,305 210,195" fill="#072219" stroke="url(#jadeGrad)" stroke-width="4" filter="url(#jadeGlow)" />
  
  <!-- Energy Sun Ray & Leaf Sync Icon -->
  <path d="M300 175 L300 240 M300 270 L300 325 M235 250 L275 250 M325 250 L365 250" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="300" cy="255" r="22" fill="url(#amberGrad)" filter="url(#jadeGlow)" />
  <circle cx="300" cy="255" r="10" fill="#fff" opacity="0.9" />

  <!-- Orbiting IoT Nodes -->
  <circle cx="210" cy="195" r="9" fill="#34d399" filter="url(#jadeGlow)" />
  <circle cx="390" cy="195" r="9" fill="#34d399" filter="url(#jadeGlow)" />
  <circle cx="300" cy="355" r="9" fill="#f59e0b" filter="url(#jadeGlow)" />

  <!-- Badge Label -->
  <rect x="160" y="470" width="280" height="48" rx="24" fill="rgba(6, 40, 28, 0.9)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" />
  <text x="300" y="501" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" text-anchor="middle" letter-spacing="2.5">SOLARJADE SERVICE</text>
</svg>
