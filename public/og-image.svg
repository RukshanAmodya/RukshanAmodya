<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="180" r="180" fill="#0284c7" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="400" r="220" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="300" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Cyber Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Outer Card Frame Border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Top Pill / Status -->
  <g transform="translate(80, 80)">
    <rect width="280" height="40" rx="20" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
    <circle cx="22" cy="20" r="5" fill="#10b981" />
    <text x="38" y="25" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="1">AVAILABLE FOR PROJECTS</text>
  </g>

  <!-- Main Name Title -->
  <text x="80" y="220" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="68" letter-spacing="-1">Rukshan Amodya</text>

  <!-- Subtitle / Role -->
  <text x="80" y="280" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="28" letter-spacing="0.5">Full-Stack Developer • Flutter &amp; Mobile • AI Systems</text>

  <!-- Description paragraph -->
  <text x="80" y="340" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20">Founder of Coding Divers &amp; Questra • Engineering Scalable Apps, Cloud APIs &amp; AI Workflows</text>

  <!-- Tech Badges Container -->
  <g transform="translate(80, 400)">
    <!-- Badge 1: Next.js / React -->
    <rect x="0" y="0" width="140" height="46" rx="12" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="70" y="29" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Next.js / React</text>

    <!-- Badge 2: Flutter / Dart -->
    <rect x="155" y="0" width="140" height="46" rx="12" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="225" y="29" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Flutter / Dart</text>

    <!-- Badge 3: Python / FastAPI -->
    <rect x="310" y="0" width="150" height="46" rx="12" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="385" y="29" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Python / FastAPI</text>

    <!-- Badge 4: AI Agents -->
    <rect x="475" y="0" width="135" height="46" rx="12" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="542" y="29" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle">AI Agents</text>

    <!-- Badge 5: Cloudflare -->
    <rect x="625" y="0" width="135" height="46" rx="12" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.1)" />
    <text x="692" y="29" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Cloudflare</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(80, 520)">
    <text x="0" y="0" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="1">rukshanamodya.github.io/RukshanAmodya</text>
    <text x="1040" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" text-anchor="end">amodya.dev • 2026</text>
  </g>
</svg>
